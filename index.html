function dayPrint(k){const d=D[k];return `<section class="print-day"><h3>${k} · ${d.date}</h3>${d.games.filter(g=>g[0]||g[1]).map(g=>{const[h,a,hg,ag]=g;if(!h||!a){const t=a||h;return `<div class="print-game print-exempt"><span class="print-team"><img src="${T[t][1]}">${esc(T[t][0])}</span><b>Exempté</b><span></span></div>`}return `<div class="print-game"><span class="print-team"><img src="${T[h][1]}">${esc(T[h][0])}</span><b class="print-score">${hg===null?'—':`${hg} – ${ag}`}</b><span class="print-team right">${esc(T[a][0])}<img src="${T[a][1]}"></span></div>`}).join('')}</section>`}
function buildPrint(vals){const hasRank=vals.includes('rank'),ks=vals.filter(v=>v!=='rank').sort((a,b)=>+a.slice(1)-+b.slice(1));let html='';if(hasRank)html+=`<div class="print-page">${header()}${rankPrint()}</div>`;for(let i=0;i<ks.length;i+=4)html+=`<div class="print-page">${header()}${ks.slice(i,i+4).map(dayPrint).join('')}</div>`;return html||`<div class="print-page">${header()}<p>Aucun document sélectionné.</p></div>`}
function pdfBlob(vals){if(pdfPromise)return pdfPromise;pdfPromise=(async()=>{if(!window.html2canvas||!window.jspdf||!window.jspdf.jsPDF)throw new Error('Bibliothèques PDF indisponibles');const holder=document.createElement('div');holder.id='pdf-capture-'+Date.now();holder.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1';holder.innerHTML=buildPrint(vals);document.body.appendChild(holder);try{await new Promise(resolve=>setTimeout(resolve,80));const pages=[...holder.querySelectorAll('.print-page')],{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'pt',format:'a4'});for(let i=0;i<pages.length;i++){const canvas=await window.html2canvas(pages[i],{scale:1.5,backgroundColor:'#fff',useCORS:true,logging:false});const img=canvas.toDataURL('image/jpeg',0.94);if(i)pdf.addPage();pdf.addImage(img,'JPEG',0,0,595.28,841.89)}return pdf.output('blob')}finally{holder.remove()}})().finally(()=>{pdfPromise=null});return pdfPromise}
async function imageBlob(vals){if(!window.html2canvas)throw new Error('Bibliothèque image indisponible');const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1';holder.innerHTML=buildPrint(vals);document.body.appendChild(holder);try{const pages=[...holder.querySelectorAll('.print-page')],scale=1.35,width=794*scale,height=pages.reduce((n,p)=>n+Math.max(1123,p.scrollHeight)*scale,0),canvas=document.createElement('canvas');canvas.width=Math.ceil(width);canvas.height=Math.ceil(height);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);let y=0;for(const page of pages){const shot=await window.html2canvas(page,{scale,backgroundColor:'#fff',useCORS:true});ctx.drawImage(shot,0,y);y+=shot.height}return await new Promise(resolve=>canvas.toBlob(resolve,'image/png'))}finally{holder.remove()}}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function sharePdf(vals){const blob=await pdfBlob(vals);const file=new File([blob],'championnat-u13-selection.pdf',{type:'application/pdf'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:document.title,text:'Championnat U13 — documents sélectionnés',files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}saveBlob(blob,'championnat-u13-selection.pdf');window.open('https://web.whatsapp.com/','_blank');setTimeout(()=>alert('Le PDF a été téléchargé. Sur iPhone ou iPad, le partage natif peut le joindre directement à WhatsApp. Sur ordinateur, ajoute-le dans WhatsApp Web avec le bouton trombone.'),250)}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('open'));$('#printBtn').onclick=()=>openSelector('print');$('#downloadBtn').onclick=()=>openSelector('download');$('#waBtn').onclick=()=>openSelector('whatsapp');$('#selectAll').onclick=()=>document.querySelectorAll('#pickList input').forEach(x=>x.checked=true);$('#selectNone').onclick=()=>document.querySelectorAll('#pickList input').forEach(x=>x.checked=false);$('#confirmSelect').onclick=async()=>{const vals=picks(),mode=$('#selectSide').dataset.mode;selected=new Set(vals.filter(v=>v!=='rank'));$('#selectSide').classList.remove('open');const btn=$('#confirmSelect');btn.disabled=true;try{if(mode==='print'){const doc=$('#printDoc');doc.innerHTML=buildPrint(vals);window.print();setTimeout(()=>doc.innerHTML='',800)}else if(mode==='download'){toast('Génération du PDF…');saveBlob(await pdfBlob(vals),'championnat-u13-selection.pdf')}else{toast('Partage du PDF…');await sharePdf(vals)}}catch(e){console.error(e);if(mode==='whatsapp'){alert('La génération du PDF a échoué. Utilise le bouton Télécharger.')}else{toast('PDF indisponible : ouverture de l’impression');const doc=$('#printDoc');doc.innerHTML=buildPrint(vals);window.print();setTimeout(()=>doc.innerHTML='',800)}}finally{btn.disabled=false}};$('#resetBtn').onclick=()=>{if(confirm('Réinitialiser tous les scores ?')){localStorage.removeItem(store);location.reload()}};renderRank();renderDays();
</script></body></html>
